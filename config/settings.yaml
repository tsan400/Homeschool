# Engine settings. Edit freely; changes apply on the next command.
model: claude-opus-5-5          # Claude model used to read handwriting
confidence_threshold: 0.85      # transcriptions below this go to the review queue
scan_dpi: 200
max_upload_mb: 40
bible_translation: ESV         # Phase 3
daily_minutes: [45, 60]

levels:
  up_pct: 0.85          # session score that counts toward a level-up
  up_sessions: 3        # consecutive qualifying sessions needed
  down_pct: 0.60        # session score that counts toward a level-down
  down_sessions: 2      # consecutive low sessions needed
  min_problems: 4       # a session needs at least this many problems of the skill to count
  too_easy_fast_track: 0.5   # >= up_pct AND more than this share marked "too easy" -> level up now

math:
  problems_per_day: 15
  problems_per_page: 6  # 3-6; packets keep the layout they were printed with
  review_fraction: 0.2  # share of problems spent on spaced review of mastered skills
  active_skills: 3      # how many unmastered skills to work on at once
  min_per_skill: 4
  max_stuck_examples: 3 # worked examples per day for "stuck" problems

ao:                     # AmblesideOnline readings for children with an AO year set (Family page)
  days:                 # one reading a day; other days are math and French only
    mon: history        # This Country of Ours, a chapter a week
    tue: science        # Fabre's Story-Book of Science, two chapters a week
    wed: nature         # Madam How and Lady Why
    thu: science

french:                 # the audio course; the packet names the next lesson, which moves on once marked done
  course: coffee-break-french-1   # content/french/: Coffee Break French, Season 1, a free podcast
  # Other free choices: Language Transfer "Introduction to French" (free app), or Pimsleur
  # through a public library's Libby or Hoopla, where the library carries it.
