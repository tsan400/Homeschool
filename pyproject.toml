[project]
name = "hs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "segno>=1.6.6",
    "typer>=0.27.2",
    "typst>=0.15.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hs = "hs:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
