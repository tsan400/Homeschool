# K-12 math scope and sequence: the map the engine's skills tree is built from.
#
# AmblesideOnline doesn't prescribe a math sequence; its Math page lists programs to choose
# from (amblesideonline.org/math). This list follows the sequence of the ones it names that
# fit a Charlotte Mason, paper-and-pencil approach:
#   K-5   Charlotte Mason Elementary Arithmetic (Baburina, Simply Charlotte Mason), Books 1-5,
#         which reconstructs what Mason's PNEU schools taught and when; Ray's Arithmetic
#   3-8   Strayer-Upton Practical Arithmetics, Books 1-3 (Book 1 gr 3-4, 2 gr 5-6, 3 gr 7-8)
#   8-9   Harold Jacobs, Elementary Algebra (chapter order)
#   10    Harold Jacobs, Geometry: Seeing, Doing, Understanding; Euclid's Elements, Book I
#   11-12 Algebra 2 and precalculus in conventional order; Jacobs, Mathematics: A Human
#         Endeavor, as an alternative survey course
# Where those books disagree on timing, the standard US grade placement decides.
#
# Charlotte Mason's method, which shapes the `mode` of the early grades:
#   - Formal arithmetic starts in Year 1 (about age 6). Year 0 (K) is play with real objects.
#   - Short lessons (20 min, 30 by grade 4), concrete objects (beans, coins) before symbols,
#     mental arithmetic every day, and accuracy before speed.
#   - Geometry starts as "inventional geometry", drawing and constructing with ruler and
#     compass in the middle years, before Euclid and proof.
#
# Fields:
#   id      unique. When it matches an id in skills.yaml, the engine generates and grades it.
#   strand  number, operations, fractions, decimals, ratio, expressions, equations,
#           functions, geometry, measurement, data
#   mode    paper     short-answer written work the engine can generate and grade
#           written   on paper, but the answer is a proof, drawing or explanation the parent checks
#           oral      mental arithmetic or narration, done aloud with the parent
#           hands-on  objects, measuring, ruler and compass
# Topics are listed in teaching order within each grade.

grades:
  - grade: 0
    label: K (AO Year 0)
    sources: [informal play with objects, before formal lessons]
    topics:
      - {id: count_20, strand: number, mode: hands-on, name: Count real objects to 20, one to one}
